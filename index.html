<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Demo</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
        }

        .content {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 32px 20px;
        }

        .flex-div {
            width: 100%;
            max-width: 1000px;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            gap: 40px;
        }

        .name-content {
            max-width: 400px;
        }

        .logo {
            font-size: 3.5rem;
            color: #1877f2;
            margin-bottom: 12px;
        }

        .name-content p {
            font-size: 1.3rem;
            line-height: 1.5;
            color: #4a5568;
        }

        .login-card {
            display: flex;
            flex-direction: column;
            background: #fff;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            border-radius: 8px;
            box-shadow:
                0 2px 4px rgb(0 0 0 / 10%),
                0 8px 16px rgb(0 0 0 / 10%);
        }

        .demo-label {
            margin-bottom: 16px;
            color: #64748b;
            font-size: 13px;
            text-align: center;
        }

        .login-card input {
            width: 100%;
            padding: 15px 16px;
            margin-bottom: 12px;
            font-size: 16px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            outline: none;
        }

        .login-card input:focus {
            border: 1.5px solid #1877f2;
            box-shadow: 0 0 0 2px rgb(24 119 242 / 12%);
        }

        .login {
            background: #1877f2;
            color: #fff;
            padding: 14px;
            font-size: 18px;
            font-weight: 700;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 16px;
        }

        .login:hover {
            background: #166fe5;
        }

        .forgot {
            color: #1877f2;
            text-decoration: none;
            font-size: 14px;
            text-align: center;
            margin-bottom: 20px;
        }

        .forgot:hover {
            text-decoration: underline;
        }

        hr {
            border: 0;
            border-top: 1px solid #dadde1;
            margin-bottom: 20px;
        }

        .create-account {
            background: #42b72a;
            color: white;
            padding: 14px 18px;
            font-size: 16px;
            font-weight: 700;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            align-self: center;
        }

        .create-account:hover {
            background: #36a420;
        }

        .status {
            display: none;
            margin-top: 16px;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            line-height: 1.5;
        }

        .status.visible {
            display: block;
        }

        .status.success {
            background: #dcfce7;
            color: #166534;
        }

        .status.error {
            background: #fee2e2;
            color: #991b1b;
        }

        .footer {
            text-align: center;
            color: #737373;
            font-size: 12px;
            margin-top: 28px;
        }

        @media (max-width: 760px) {
            .content {
                align-items: flex-start;
                padding-top: 45px;
            }

            .flex-div {
                flex-direction: column;
                gap: 28px;
            }

            .name-content {
                text-align: center;
            }

            .logo {
                font-size: 3rem;
            }

            .name-content p {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>
    <main class="content">
        <div class="flex-div">
            <section class="name-content">
                <h1 class="logo">Facebook</h1>
                <p>
                    Connect with friends and the world around you.
                </p>
            </section>

            <section>
                <form class="login-card" id="loginForm">
                    <p class="demo-label">
                        Login interface demo — do not enter real passwords
                    </p>

                    <input
                        type="text"
                        id="accountInput"
                        name="account"
                        placeholder="Email or phone number"
                        autocomplete="off"
                        required
                    >

                    <input
                        type="password"
                        id="passwordInput"
                        name="demoPassword"
                        placeholder="Demo password"
                        autocomplete="new-password"
                        required
                    >

                    <button type="submit" class="login" id="loginButton">
                        Log In
                    </button>

                    <a href="#" class="forgot" id="forgotLink">
                        Forgot password?
                    </a>

                    <hr>

                    <button
                        type="button"
                        class="create-account"
                        id="createButton"
                    >
                        Create new account
                    </button>

                    <div
                        class="status"
                        id="statusMessage"
                        role="status"
                        aria-live="polite"
                    ></div>
                </form>

                <p class="footer">
                    Demonstration page. Not affiliated with Facebook.
                </p>
            </section>
        </div>
    </main>

    <script>
        const form = document.getElementById("loginForm");
        const accountInput = document.getElementById("accountInput");
        const passwordInput = document.getElementById("passwordInput");
        const loginButton = document.getElementById("loginButton");
        const statusMessage = document.getElementById("statusMessage");

        function showStatus(message, type) {
            statusMessage.textContent = message;
            statusMessage.className = "status visible " + type;
        }

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            const account = accountInput.value.trim();

            if (!account || !passwordInput.value) {
                showStatus("Please complete the demo form.", "error");
                return;
            }

            loginButton.disabled = true;
            loginButton.textContent = "Please wait...";

            try {
                // ส่งเฉพาะกิจกรรมและบัญชีทดสอบ
                // ไม่ส่งหรือบันทึกรหัสผ่าน
                const response = await fetch(
                    "/api/login-notification",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            event: "demo_login_attempt",
                            account: account,
                            timestamp: new Date().toISOString()
                        })
                    }
                );

                if (!response.ok) {
                    throw new Error("Notification request failed");
                }

                showStatus(
                    "Demo login attempt recorded successfully.",
                    "success"
                );
            } catch (error) {
                showStatus(
                    "Notification service is unavailable. Please check your backend.",
                    "error"
                );
            } finally {
                loginButton.disabled = false;
                loginButton.textContent = "Log In";

                // ล้างรหัสผ่านทดสอบออกจากช่องกรอก
                passwordInput.value = "";
            }
        });

        document.getElementById("forgotLink").addEventListener(
            "click",
            function (event) {
                event.preventDefault();
                showStatus(
                    "This is a demonstration page. Password recovery is not enabled.",
                    "error"
                );
            }
        );

        document.getElementById("createButton").addEventListener(
            "click",
            function () {
                showStatus(
                    "Account registration is not enabled in this demo.",
                    "error"
                );
            }
        );
    </script>
</body>
</html>
