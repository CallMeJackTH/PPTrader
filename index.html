<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#10b981">
    <title>KayaScan - Smart Waste </title>

    <link rel="icon" href="https://i.ibb.co/Kx3CJPBR/grok-1788171605554.jpg" type="image/jpeg">
    <link rel="apple-touch-icon" href="https://i.ibb.co/Kx3CJPBR/grok-1788171605554.jpg">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Prompt', sans-serif;
            -webkit-tap-highlight-color: transparent;
            background-color: #f1f5f9;
        }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        .app-container {
            width: 100%;
            margin: 0 auto;
            background: #ffffff;
            position: relative;
            overflow-x: hidden;
            overflow-y: auto;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
            transition: max-width 0.4s cubic-bezier(0.4, 0, 0.2, 1), border-radius 0.4s ease;
        }
        @media (min-width: 640px) {
            .app-container { height: 90vh; max-height: 900px; border-radius: 2.5rem; border: 8px solid #1e293b; margin-top: 5vh; }
        }
        @media (max-width: 639px) {
            .app-container { height: 100vh; height: 100dvh; border-radius: 0; max-width: 100% !important; }
        }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        .animate-slide-up { animation: slideUp 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .camera-view {
            position: absolute; inset: 0; background: #000; z-index: 100;
            display: flex; flex-direction: column; transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .camera-view.active { transform: translateY(0); }
        .camera-video-container { flex: 1; position: relative; overflow: hidden; background: #111; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .camera-guide { position: absolute; inset: 15%; border: 2px dashed rgba(255,255,255,0.5); border-radius: 1rem; pointer-events: none; }
        .spinner { width: 48px; height: 48px; border: 4px solid #d1fae5; border-top-color: #10b981; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .cache-badge {
            display: inline-flex; align-items: center; gap: 4px;
            background: #eff6ff; color: #2563eb; border: 1px solid #bfdbfe;
            font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px;
        }
        .quota-note { font-size: 11px; color: #94a3b8; text-align: center; }
    </style>
</head>
<body class="text-slate-800 antialiased flex items-center justify-center min-h-screen relative">

    <div class="app-container flex flex-col max-w-[440px]">

        <header class="bg-emerald-600 text-white p-5 pt-8 rounded-b-3xl shadow-md z-10 shrink-0">
            <div class="flex items-center gap-3 mb-2">
                <div class="bg-white p-2 rounded-xl text-emerald-600">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                </div>
                <h1 class="text-2xl font-bold tracking-wide">KayaScan</h1>
            </div>
            <p class="text-emerald-100 text-sm opacity-90">AI ตรวจสอบและแนะนำวิธีแยกขยะ (Groq Vision)</p>
        </header>

        <main class="flex-1 overflow-y-auto p-5 space-y-5 relative">

            <div id="dropZone" class="border-2 border-dashed border-slate-300 rounded-3xl p-8 text-center cursor-pointer hover:border-emerald-500 hover:bg-emerald-50 transition-colors group flex flex-col items-center justify-center min-h-[220px]">
                <div class="bg-slate-100 group-hover:bg-emerald-100 p-4 rounded-full mb-3 transition-colors">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#0ea5e9" stroke-width="2" class="group-hover:stroke-emerald-600"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><path d="M21 15l-5-5L5 21"></path></svg>
                </div>
                <h3 class="font-semibold text-slate-700 text-lg mb-1">แตะเพื่อเลือกรูปภาพ</h3>
                <p class="text-xs text-slate-400 mb-2">JPG, PNG, WebP</p>
                <input type="file" id="fileInput" accept="image/*" class="hidden">
            </div>

            <div id="previewWrapper" class="hidden relative rounded-3xl overflow-hidden shadow-sm border border-slate-200 bg-slate-50 w-full max-w-2xl mx-auto">
                <img id="previewImage" class="w-full h-[300px] object-contain bg-slate-100" alt="Preview">
                <button id="resetBtn" class="absolute top-3 right-3 bg-white/90 backdrop-blur text-slate-700 p-2 rounded-full shadow-lg hover:bg-white" title="ลบรูป">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"></path></svg>
                </button>
            </div>

            <div class="grid grid-cols-2 gap-4 max-w-2xl mx-auto">
                <button id="cameraBtn" class="bg-white border-2 border-slate-200 text-slate-700 font-semibold py-3.5 rounded-2xl flex items-center justify-center gap-2 hover:border-emerald-400 hover:text-emerald-600 transition-colors active:scale-95">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
                    เปิดกล้อง
                </button>
                <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden">

                <button id="analyzeBtn" disabled class="bg-emerald-500 hover:bg-emerald-600 disabled:bg-slate-300 disabled:text-slate-500 text-white font-semibold py-3.5 rounded-2xl flex items-center justify-center gap-2 shadow-lg shadow-emerald-200 transition-all active:scale-95">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                    <span id="analyzeBtnLabel">วิเคราะห์เลย</span>
                </button>
            </div>
            <p class="quota-note max-w-2xl mx-auto -mt-2">ภาพซ้ำจะดึงจากแคชโดยไม่ใช้โควต้า • ฟรี 1,000 ครั้ง/วัน รีเซ็ตทุก 24 ชม.</p>

            <div id="errorBox" class="hidden bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded-2xl text-sm max-w-2xl mx-auto flex gap-2 items-start animate-fade-in">
                <span id="errorText"></span>
            </div>

            <div id="loader" class="hidden flex-col items-center justify-center py-8 animate-fade-in max-w-2xl mx-auto">
                <div class="spinner mb-4"></div>
                <p class="text-emerald-700 font-medium">กำลังใช้ Groq AI วิเคราะห์ภาพ...</p>
            </div>

            <div id="resultArea" class="hidden space-y-4 pb-6 animate-slide-up max-w-2xl mx-auto"></div>

        </main>

        <div id="cameraView" class="camera-view">
            <div class="absolute top-0 inset-x-0 p-4 z-10 flex justify-between items-center bg-gradient-to-b from-black/80 to-transparent">
                <button id="closeCameraBtn" class="text-white bg-black/50 p-2 rounded-full backdrop-blur">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"></path></svg>
                </button>
                <span id="cameraStatus" class="text-white/80 text-sm font-medium">เตรียมกล้อง...</span>
                <div class="w-10"></div>
            </div>
            <div class="camera-video-container">
                <video id="cameraVideo" autoplay playsinline muted></video>
                <div class="camera-guide"></div>
            </div>
            <div class="bg-black/90 pb-8 pt-6 px-6 flex justify-center items-center h-[140px] shrink-0">
                <button id="captureCameraBtn" disabled class="w-20 h-20 bg-emerald-500 rounded-full border-4 border-white/20 flex items-center justify-center disabled:opacity-50">
                    <div class="w-14 h-14 border-2 border-white rounded-full bg-white/20"></div>
                </button>
            </div>
        </div>

    </div>

    <script>
        // ========================================================================
        // การตั้งค่า API — Groq, OpenAI-compatible Chat Completions (ฟรี)
        // ใช้ qwen/qwen3.6-27b โมเดล vision ตัวหลักบน Groq free tier รองรับภาพ
        // + text พร้อม JSON mode ในตัว
        // Free tier ของโมเดลนี้: 30 requests/นาที, 1,000 requests/วัน (RPD)
        // โควต้ารีเซ็ตทุก 24 ชม. โดยอัตโนมัติ — ไม่มีค่าใช้จ่าย ไม่ต้องผูกบัตร
        // ขนาดภาพไม่กระทบจำนวน token (คิดคงที่ 2048 token/ภาพ) แต่ยังจำกัด
        // ไฟล์ไม่เกิน 20MB/ภาพ และส่งได้สูงสุด 5 ภาพ/คำขอ (ที่นี่ใช้ 1 ภาพ)
        // ========================================================================
        const API_KEY = "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";
        const MODEL = "qwen/qwen3.6-27b";
        const BASE_URL = "https://api.groq.com/openai/v1";
        const API_URL = `${BASE_URL}/chat/completions`;

        const MAX_IMAGE_DIM = 768;
        const JPEG_QUALITY = 0.82;

        // จำกัดจำนวนคำขอฝั่ง client แบบระมัดระวัง — Groq free tier ให้ 30
        // requests/นาที (เกินพอสำหรับ 3 วิ/ครั้ง) แต่เพดานจริงต่อวันคือ 1,000
        // requests ดังนั้นดีเลย์นี้กันไม่ให้กดรัวจนชน RPM เฉยๆ ไม่ได้กันโควต้า/วันหมด
        const MIN_INTERVAL_MS = 3000;
        const RATE_LIMIT_BACKOFF_MS = 60000;
        const LS_LAST_REQUEST_KEY = "kayascan_last_request_ts";
        const LS_CACHE_PREFIX = "kayascan_cache_";

        const RESULT_FIELDS_PROMPT = `ตอบกลับเป็น JSON เท่านั้น (ห้ามมีข้อความอื่นนอกเหนือจาก JSON) ตามโครงสร้างนี้เป๊ะๆ:
{"isWaste": true/false, "objectName": "ชื่อวัตถุ", "category": "รีไซเคิล หรือ อินทรีย์ หรือ ทั่วไป หรือ อันตราย", "binColor": "สีถังขยะ", "disposalMethods": ["ขั้นตอนสั้นๆ สูงสุด 2 ข้อ"], "reuse": "วิธีนำกลับมาใช้ใหม่แบบสั้น"}`;

        let base64Image = null;
        let imageMimeType = null;
        let cameraStream = null;
        let cooldownTimer = null;

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const previewWrapper = document.getElementById('previewWrapper');
        const previewImage = document.getElementById('previewImage');
        const resetBtn = document.getElementById('resetBtn');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const analyzeBtnLabel = document.getElementById('analyzeBtnLabel');
        const cameraBtn = document.getElementById('cameraBtn');
        const cameraInput = document.getElementById('cameraInput');
        const cameraView = document.getElementById('cameraView');
        const cameraVideo = document.getElementById('cameraVideo');
        const closeCameraBtn = document.getElementById('closeCameraBtn');
        const captureCameraBtn = document.getElementById('captureCameraBtn');
        const errorBox = document.getElementById('errorBox');
        const errorText = document.getElementById('errorText');
        const loader = document.getElementById('loader');
        const resultArea = document.getElementById('resultArea');
        const ANALYZE_DEFAULT_LABEL = analyzeBtnLabel.textContent;

        dropZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', e => processFile(e.target.files[0]));
        cameraInput.addEventListener('change', e => processFile(e.target.files[0]));
        resetBtn.addEventListener('click', resetUI);
        cameraBtn.addEventListener('click', openCamera);
        closeCameraBtn.addEventListener('click', closeCamera);
        captureCameraBtn.addEventListener('click', captureCameraPhoto);

        // ---------------- กล้อง ----------------
        async function openCamera() {
            try {
                cameraView.classList.add('active');
                cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                cameraVideo.srcObject = cameraStream;
                await cameraVideo.play();
                captureCameraBtn.disabled = false;
            } catch (err) {
                closeCamera();
                cameraInput.click();
            }
        }

        function closeCamera() {
            cameraView.classList.remove('active');
            if (cameraStream) { cameraStream.getTracks().forEach(t => t.stop()); cameraStream = null; }
        }

        function captureCameraPhoto() {
            if (!cameraStream) return;
            const canvas = document.createElement('canvas');
            canvas.width = cameraVideo.videoWidth; canvas.height = cameraVideo.videoHeight;
            canvas.getContext('2d').drawImage(cameraVideo, 0, 0);
            canvas.toBlob(blob => { closeCamera(); processFile(new File([blob], 'photo.jpg', { type: 'image/jpeg' })); }, 'image/jpeg', 0.85);
        }

        // ---------------- จัดการไฟล์ภาพ ----------------
        function processFile(file) {
            if (!file) return;
            dropZone.classList.add('hidden');
            previewWrapper.classList.remove('hidden');
            resultArea.classList.add('hidden');
            errorBox.classList.add('hidden');
            analyzeBtn.disabled = true;

            // ย่อภาพให้ทั้งสองด้าน <= 768px เพื่อลดขนาดไฟล์/เวลาอัปโหลด
            // (Groq คิด token คงที่ 2048 ต่อภาพเสมอไม่ว่าความละเอียดเท่าไหร่
            // แต่ไฟล์เล็กลงยังช่วยให้ส่งไว ประหยัด bandwidth บนมือถือ)
            const reader = new FileReader();
            reader.onload = e => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let w = img.width, h = img.height;
                    if (w > h && w > MAX_IMAGE_DIM) { h = Math.round(h * MAX_IMAGE_DIM / w); w = MAX_IMAGE_DIM; }
                    else if (h >= w && h > MAX_IMAGE_DIM) { w = Math.round(w * MAX_IMAGE_DIM / h); h = MAX_IMAGE_DIM; }
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    const dataUrl = canvas.toDataURL('image/jpeg', JPEG_QUALITY);
                    previewImage.src = dataUrl;
                    base64Image = dataUrl.split(',')[1];
                    imageMimeType = 'image/jpeg';
                    updateAnalyzeButtonState();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function resetUI() {
            fileInput.value = ''; cameraInput.value = ''; base64Image = null;
            previewWrapper.classList.add('hidden'); dropZone.classList.remove('hidden');
            resultArea.classList.add('hidden'); errorBox.classList.add('hidden');
            analyzeBtn.disabled = true;
        }

        // ---------------- แคชผลลัพธ์ (ลดการเรียก API ซ้ำสำหรับภาพเดิม) ----------------
        function hashBase64(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = (hash * 31 + str.charCodeAt(i)) | 0;
            }
            return 'k' + (hash >>> 0).toString(36) + str.length.toString(36);
        }

        function getCachedResult(key) {
            try {
                const raw = localStorage.getItem(LS_CACHE_PREFIX + key);
                return raw ? JSON.parse(raw) : null;
            } catch (e) { return null; }
        }

        function setCachedResult(key, data) {
            try { localStorage.setItem(LS_CACHE_PREFIX + key, JSON.stringify(data)); } catch (e) { /* เต็มก็ข้ามไป ไม่กระทบการทำงาน */ }
        }

        // ---------------- จำกัดอัตราการเรียก API ----------------
        function getLastRequestTs() {
            try { return parseInt(localStorage.getItem(LS_LAST_REQUEST_KEY) || '0', 10); } catch (e) { return 0; }
        }
        function setLastRequestTs(ts) {
            try { localStorage.setItem(LS_LAST_REQUEST_KEY, String(ts)); } catch (e) { /* ignore */ }
        }
        function remainingCooldownMs() {
            return Math.max(0, MIN_INTERVAL_MS - (Date.now() - getLastRequestTs()));
        }

        function updateAnalyzeButtonState() {
            const cooling = remainingCooldownMs() > 0;
            if (!cooling) {
                clearInterval(cooldownTimer);
                analyzeBtnLabel.textContent = ANALYZE_DEFAULT_LABEL;
                analyzeBtn.disabled = !base64Image;
            }
        }

        function startCooldownUI(ms) {
            clearInterval(cooldownTimer);
            let remaining = Math.ceil(ms / 1000);
            analyzeBtn.disabled = true;
            const tick = () => {
                if (remaining <= 0) {
                    clearInterval(cooldownTimer);
                    analyzeBtnLabel.textContent = ANALYZE_DEFAULT_LABEL;
                    analyzeBtn.disabled = !base64Image;
                    return;
                }
                analyzeBtnLabel.textContent = `รอ ${remaining} วิ (กันโควต้าหมด)`;
                remaining--;
            };
            tick();
            cooldownTimer = setInterval(tick, 1000);
        }

        // ---------------- เรียก Groq API ----------------
        async function callGroq(b64, mime) {
            const body = {
                model: MODEL,
                messages: [
                    { role: "system", content: "คุณเป็นผู้เชี่ยวชาญคัดแยกขยะในไทย ตอบเป็น JSON เท่านั้น ห้ามมีข้อความอื่นนอกเหนือจาก JSON ตอบให้กระชับที่สุด" },
                    {
                        role: "user",
                        content: [
                            { type: "text", text: "วิเคราะห์ขยะในภาพนี้ แนะนำวิธีทิ้ง/รีไซเคิลอย่างกระชับ\n\n" + RESULT_FIELDS_PROMPT },
                            { type: "image_url", image_url: { url: `data:${mime};base64,${b64}` } }
                        ]
                    }
                ],
                max_completion_tokens: 250,
                temperature: 0.1,
                response_format: { type: "json_object" },
                // qwen3.6-27b เปิด "thinking mode" เป็นค่าเริ่มต้น ซึ่งจะแทรก
                // ข้อความ <think>...</think> มาก่อน JSON แล้วทำให้ parse พัง
                // reasoning_effort: "none" ปิดโหมดคิดยาวเพื่อความไวและ JSON สะอาด
                // reasoning_format: "hidden" กันเผื่อ (ตัดข้อความ reasoning ที่หลุดออกมา)
                reasoning_effort: "none",
                reasoning_format: "hidden"
            };

            let res;
            try {
                res = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify(body)
                });
            } catch (networkErr) {
                // fetch เองล้มเหลว (ไม่ถึงเซิร์ฟเวอร์เลย) มักเกิดจาก: ไม่มีอินเทอร์เน็ต,
                // เปิดไฟล์แบบ file:// แล้วโดนบล็อกโดยเบราว์เซอร์/ส่วนขยาย, หรือ CORS ผิดปกติ
                const e = new Error('เชื่อมต่อเซิร์ฟเวอร์ Groq ไม่ได้เลย (เช็คอินเทอร์เน็ต หรือลองเปิดผ่าน http://localhost แทนการเปิดไฟล์ตรงๆ)');
                e.status = 0;
                throw e;
            }

            if (!res.ok) {
                let detail = '';
                try {
                    const errJson = await res.json();
                    detail = errJson.error?.message || errJson.message || '';
                } catch (parseErr) { /* ไม่ใช่ JSON ก็ปล่อยผ่าน แสดงแค่ status */ }
                const err = new Error(`API ผิดพลาด (${res.status})${detail ? ': ' + detail : ''}`);
                err.status = res.status;
                throw err;
            }

            const data = await res.json();
            const rawText = data.choices?.[0]?.message?.content;
            if (!rawText) throw new Error("ไม่พบผลลัพธ์จาก AI");
            // กันเผื่อโมเดลห่อ JSON ด้วย ```json ... ``` ทั้งที่สั่งห้ามแล้ว
            const cleaned = rawText.trim().replace(/^```json\s*/i, '').replace(/```$/, '').trim();
            return JSON.parse(cleaned);
        }

        analyzeBtn.addEventListener('click', async () => {
            if (!base64Image) return;
            errorBox.classList.add('hidden');

            // 1) เช็คแคชก่อนเสมอ — ภาพเดิมไม่ใช้โควต้าเลย
            const cacheKey = hashBase64(base64Image);
            const cached = getCachedResult(cacheKey);
            if (cached) {
                renderResult(cached, true);
                return;
            }

            // 2) เช็คคูลดาวน์ก่อนยิง API จริง
            const wait = remainingCooldownMs();
            if (wait > 0) {
                startCooldownUI(wait);
                return;
            }

            analyzeBtn.disabled = true;
            resultArea.classList.add('hidden');
            loader.classList.remove('hidden'); loader.classList.add('flex');

            try {
                setLastRequestTs(Date.now());
                const result = await callGroq(base64Image, imageMimeType);
                setCachedResult(cacheKey, result);
                renderResult(result, false);
                updateAnalyzeButtonState();
            } catch (err) {
                if (err.status === 429) {
                    setLastRequestTs(Date.now());
                    errorText.textContent = "โควต้าเต็มชั่วคราว ระบบจะรอให้อัตโนมัติก่อนลองใหม่";
                    startCooldownUI(RATE_LIMIT_BACKOFF_MS);
                } else {
                    errorText.textContent = "เกิดข้อผิดพลาด: " + err.message;
                    updateAnalyzeButtonState();
                }
                errorBox.classList.remove('hidden');
            } finally {
                loader.classList.add('hidden'); loader.classList.remove('flex');
            }
        });

        function renderResult(data, fromCache) {
            const methodsHTML = (data.disposalMethods || []).map(m => `<li class="flex gap-2"><span class="text-emerald-500">✓</span><span>${m}</span></li>`).join('');
            const cacheBadge = fromCache ? `<span class="cache-badge">⚡ จากแคช • ไม่ใช้โควต้า</span>` : '';

            resultArea.innerHTML = `
                <div class="rounded-2xl border bg-emerald-50 text-emerald-700 border-emerald-200 p-4 font-semibold flex items-center justify-between gap-2">
                    <span>♻️ ผลการวิเคราะห์ขยะ</span>${cacheBadge}
                </div>
                <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-3">
                    <div class="grid grid-cols-2 gap-4 text-sm">
                        <div><p class="text-slate-400 text-xs">วัตถุ</p><p class="font-medium">${data.objectName || '-'}</p></div>
                        <div><p class="text-slate-400 text-xs">ประเภท</p><p class="font-medium">${data.category || '-'}</p></div>
                        <div class="col-span-2"><p class="text-slate-400 text-xs">ถังขยะ</p><p class="font-medium">${data.binColor || '-'}</p></div>
                    </div>
                </div>
                <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
                    <h3 class="text-slate-500 text-sm font-semibold mb-2 uppercase">วิธีจัดการ</h3>
                    <ul class="text-sm text-slate-700 space-y-1">${methodsHTML}</ul>
                </div>
                <div class="bg-slate-50 rounded-2xl border border-slate-200 p-5">
                    <h3 class="text-slate-500 text-sm font-semibold mb-1 uppercase">การนำกลับมาใช้ใหม่</h3>
                    <p class="text-sm text-slate-700">${data.reuse || '-'}</p>
                </div>`;
            resultArea.classList.remove('hidden');
        }

        // ตรวจสถานะคูลดาวน์ทุกครั้งที่โหลดหน้า (กรณีปิด-เปิดแอปใหม่ระหว่างคูลดาวน์)
        updateAnalyzeButtonState();
    </script>
</body>
</html>
